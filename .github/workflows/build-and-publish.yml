name: build-publish

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv sync --group dev
      - run: uv run pytest
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run mypy src tests

  build-publish:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: name=coilysiren-eco-spec-tracker make .build-docker
      # GHCR path is pinned to the pre-rename repo name (coilysiren/eco-spec-tracker)
      # to match the Makefile's image-url, which derives from config.yml's `name`
      # field (intentionally still on the old name; see README.md naming note).
      # github.repository now resolves to coilysiren/eco-jobs-tracker after the
      # 2026-05-02 rename, so don't use it here.
      - run: docker tag coilysiren-eco-spec-tracker:latest ghcr.io/coilysiren/eco-spec-tracker/coilysiren-eco-spec-tracker:${{ github.sha }}
      - run: docker push ghcr.io/coilysiren/eco-spec-tracker/coilysiren-eco-spec-tracker:${{ github.sha }}
