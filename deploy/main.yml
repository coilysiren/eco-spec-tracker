apiVersion: v1
kind: Namespace
metadata:
  name: ${NAME}
---
# Deployer ServiceAccount for the Forgejo Actions release pipeline. The CI
# deploy job authenticates as this SA to roll the app Deployment over the
# LAN (kubeconfig in the Forgejo Actions secret DEPLOY_KUBECONFIG on
# coilysiren/eco-jobs-tracker, built from this SA's token Secret below). No
# tailnet join, no SSH. See coilysiren/eco-jobs-tracker#19, coilysiren/backend#25.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: deployer
  namespace: ${NAME}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deployer
  namespace: ${NAME}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments/status"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deployer
  namespace: ${NAME}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: deployer
subjects:
  - kind: ServiceAccount
    name: deployer
    namespace: ${NAME}
---
# Long-lived token for the deployer SA. Kubernetes populates token, ca.crt,
# and namespace into this Secret; the DEPLOY_KUBECONFIG Forgejo secret is
# built from its ca.crt + token. Regenerate the kubeconfig if rotated. The
# token never lives in git. See coilysiren/eco-jobs-tracker#19.
apiVersion: v1
kind: Secret
metadata:
  name: deployer-token
  namespace: ${NAME}
  annotations:
    kubernetes.io/service-account.name: deployer
type: kubernetes.io/service-account-token

---
# Sentry DSN for this service, synced from AWS SSM via external-secrets.
# Consumed by src/eco_spec_tracker/telemetry.py's
# `sentry_sdk.init(dsn=os.getenv("SENTRY_DSN"))`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${NAME}-sentry
  namespace: ${NAME}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-parameter-store
    kind: ClusterSecretStore
  target:
    name: ${NAME}-sentry
    creationPolicy: Owner
  data:
    - secretKey: SENTRY_DSN
      remoteRef:
        key: /sentry-dsn/eco-spec-tracker

---
# Eco admin API token. The mod's /api/v1/skills endpoint runs inside Eco's
# ASP.NET Core host, which requires X-API-Key on /api/v1/* (same middleware
# eco-mcp-app hits for /api/v1/exporter/*). upstream.py forwards the token
# via UPSTREAM_API_KEY. Reuses the eco-mcp-app SSM param since there's one
# admin token per Eco server; no reason to fan out.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${NAME}-upstream
  namespace: ${NAME}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-parameter-store
    kind: ClusterSecretStore
  target:
    name: ${NAME}-upstream
    creationPolicy: Owner
  data:
    - secretKey: UPSTREAM_API_KEY
      remoteRef:
        key: /eco-mcp-app/api-admin-token

---
# Tailnet device for this service. Auth key minted by
# terraform/tailscale-devices/ in coilysiren/infrastructure under the
# short name `eco-spec`; lands in SSM at /coilysiren/eco-spec/
# ts-authkey and the ExternalSecret below materializes it into the
# namespace. State persists in a k8s Secret (ts-state) so pod restarts
# re-use the device identity without re-consuming the single-use key.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ${NAME}-ts
  namespace: ${NAME}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ${NAME}-ts-state
  namespace: ${NAME}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["ts-state"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ${NAME}-ts-state
  namespace: ${NAME}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ${NAME}-ts-state
subjects:
  - kind: ServiceAccount
    name: ${NAME}-ts
    namespace: ${NAME}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ts-authkey
  namespace: ${NAME}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-parameter-store
    kind: ClusterSecretStore
  target:
    name: ts-authkey
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        authkey: "{{ .authkey }}"
  data:
    - secretKey: authkey
      remoteRef:
        key: /coilysiren/eco-spec/ts-authkey
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${NAME}-app
  namespace: ${NAME}
  labels:
    app: ${NAME}-app
spec:
  selector:
    matchLabels:
      app: ${NAME}-app
  template:
    metadata:
      labels:
        app: ${NAME}-app
    spec:
      serviceAccountName: ${NAME}-ts
      # /dev/net/tun for the ts sidecar lives on kai-server (native
      # Linux 6.8); WSL2 nodes don't expose it. Pinning matches where
      # the pod scheduled organically before the migration.
      nodeSelector:
        kubernetes.io/hostname: kai-server
      # Resolve eco.coilysiren.me to kai-server's LAN IP from inside the pod.
      # Going out through the public DNS would require hairpin NAT on the
      # home router, which it doesn't support (same limitation that forced
      # cert-manager onto DNS-01 — see kai-server README). Hardcoded IP is
      # fine: single-node k3s, stable home LAN, same IP cert-manager uses.
      # eco-mcp-app applies the same fix; see its 1a885eac commit.
      hostAliases:
        - ip: "192.168.0.194"
          hostnames:
            - "eco.coilysiren.me"
      containers:
        - name: ${NAME}
          image: ${IMAGE}
          # Pulled from the in-cluster registry (192.168.0.194:30500) by
          # kai-server's containerd over plain http. Always, so each rolled
          # ${git-hash} tag is fetched fresh. See coilysiren/infrastructure#171.
          imagePullPolicy: Always
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          env:
            - name: PORT
              value: "80"
            - name: UPSTREAM_URL
              value: "http://eco.coilysiren.me:3001/api/v1/skills"
            - name: UPSTREAM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ${NAME}-upstream
                  key: UPSTREAM_API_KEY
            - name: SENTRY_DSN
              valueFrom:
                secretKeyRef:
                  name: ${NAME}-sentry
                  key: SENTRY_DSN
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
        # tailscale sidecar in kernel mode. Same shape as eco-mcp-app
        # and the repo-recall canary. Workload binds 0.0.0.0:80 already
        # so tailnet peers at `http://eco-spec` land in the right place
        # via the pod netns the sidecar shares.
        - name: ts
          image: tailscale/tailscale:v1.78.1
          env:
            - name: TS_HOSTNAME
              value: eco-spec
            - name: TS_KUBE_SECRET
              value: ts-state
            - name: TS_USERSPACE
              value: "false"
            - name: TS_AUTH_ONCE
              value: "true"
            - name: TS_EXTRA_ARGS
              value: "--accept-dns=false"
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  name: ts-authkey
                  key: authkey
          securityContext:
            privileged: true
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      restartPolicy: Always

---
apiVersion: v1
kind: Service
metadata:
  name: ${NAME}-service
  namespace: ${NAME}
spec:
  type: ClusterIP
  selector:
    app: ${NAME}-app
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${NAME}-ingress
  namespace: ${NAME}
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
    kubernetes.io/tls-acme: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - ${DNS_NAME}
      secretName: ${NAME}-tls
  rules:
    - host: ${DNS_NAME}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ${NAME}-service
                port:
                  number: 80
